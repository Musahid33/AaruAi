# Render Blueprint — one-click deploy of Aaru AI with Firebase Realtime Database.
# In Render: "New +" → Blueprint → select your Musahid33/AaruAi repo → Apply.
# Then in the dashboard open the service → Environment → set the secret
#   FIREBASE_SERVICE_ACCOUNT = base64 of your serviceAccountKey.json
# (value is in AARUAI-FIREBASE-SETUP.txt) and hit "Manual Deploy".
# Free tier note: the web service sleeps after ~15 min idle (first load after
# sleep takes ~50s to wake); data stays safe in Firebase either way.
services:
  - type: web
    name: aaru-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false        # secret — set it in the dashboard, never in git
      - key: EXPLABS_API_KEY
        sync: false        # secret — your xpl_… Experiential Labs key (Settings → API Manager also works)
      - key: COOKIE_SECURE
        value: "1"
      - key: PORT
        value: "3000"
