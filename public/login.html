<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome · Aaru AI</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z' fill='white'/%3E%3C/svg%3E">
<style>
:root{--bg:#04060d;--panel:rgba(13,20,36,.93);--line:rgba(148,163,184,.2);--txt:#e7ecf6;--muted:#8b94a9;--grad:linear-gradient(135deg,#6366f1,#8b5cf6);--font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:var(--font);color:var(--txt);display:flex;align-items:center;justify-content:center;background:#04060d;position:relative;overflow:hidden}
body::before{content:"";position:absolute;inset:0;background:url('/assets/hero.jpg') center/cover no-repeat,#131c33;opacity:.45}
body::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,13,.5),rgba(4,6,13,.95))}
.wrap{position:relative;z-index:1;width:100%;max-width:380px;padding:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:34px 32px;box-shadow:0 40px 90px -30px rgba(0,0,0,.85);backdrop-filter:blur(14px)}
.logo{display:flex;align-items:center;gap:11px;margin-bottom:24px}
.mark{width:38px;height:38px;border-radius:11px;background:var(--grad);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px -8px rgba(99,102,241,.6)}
.mark svg{width:20px;height:20px;color:#fff}
.name{font-size:17px;font-weight:800;letter-spacing:.3px}
h1{font-size:22px;font-weight:800;margin-bottom:18px}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;font-weight:600}
.inp{width:100%;background:#0a1120;border:1px solid var(--line);border-radius:11px;padding:12px 14px;font-size:14px;color:var(--txt);outline:none;transition:.15s;font-family:var(--font)}
.inp:focus{border-color:rgba(139,92,246,.65);box-shadow:0 0 0 3px rgba(139,92,246,.14)}
.inp::placeholder{color:#5c6579}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--grad);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;border:none;transition:.15s;box-shadow:0 12px 28px -12px rgba(99,102,241,.7);font-family:var(--font)}
.btn:hover{filter:brightness(1.12)}
.btn:disabled{opacity:.55;cursor:default}
.err{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.35);color:#fca5a5;border-radius:10px;padding:9px 13px;font-size:12.5px;margin-bottom:13px}
.err.show{display:block}
.toggle{text-align:center;margin-top:15px;font-size:12.5px;color:var(--muted)}
.toggle button{color:#a5b4fc;background:none;border:none;cursor:pointer;font-size:12.5px;font-weight:600;padding:0}
.toggle button:hover{text-decoration:underline}
.spinner{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="logo">
      <span class="mark"><svg viewBox="0 0 32 32" fill="none"><path d="M16 5l2.7 8.3L27 16l-8.3 2.7L16 27l-2.7-8.3L5 16l8.3-2.7z" fill="white"/></svg></span>
      <span class="name" id="wsName">Aaru AI</span>
    </div>
    <h1>Welcome</h1>
    <div class="err" id="err"></div>
    <form id="form" autocomplete="on">
      <div class="fld">
        <label for="username">Username</label>
        <input class="inp" id="username" placeholder="Your username" autocomplete="username" spellcheck="false" autofocus>
      </div>
      <div class="fld">
        <label for="password">Password</label>
        <input class="inp" id="password" type="password" placeholder="Your password" autocomplete="current-password">
      </div>
      <button class="btn" id="submitBtn" type="submit">Sign in</button>
    </form>
    <div class="toggle" id="toggleWrap" style="display:none">
      <span id="toggleTxt">New here?</span> <button id="toggleBtn">Create account</button>
    </div>
  </div>
</div>
<script>
'use strict';
const $=s=>document.querySelector(s);
let mode='login';
function showErr(t){const e=$('#err');e.textContent=t;e.classList.add('show')}
function clearErr(){$('#err').classList.remove('show')}
function setMode(m){
  mode=m;
  $('#submitBtn').textContent=m==='register'?'Create account':'Sign in';
  $('#password').autocomplete=m==='register'?'new-password':'current-password';
}
$('#toggleBtn').addEventListener('click',()=>{clearErr();setMode(mode==='login'?'register':'login')});
$('#form').addEventListener('submit',async(e)=>{
  e.preventDefault();clearErr();
  const username=$('#username').value.trim();
  const password=$('#password').value;
  const btn=$('#submitBtn');btn.disabled=true;btn.textContent='Please wait…';
  try{
    const r=await fetch(mode==='register'?'/api/auth/register':'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username,password})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){showErr(j.error||'Sign in failed');btn.disabled=false;btn.textContent=mode==='register'?'Create account':'Sign in';return}
    window.location.replace('/');
  }catch(err){showErr('Network error — is the server running?');btn.disabled=false;btn.textContent=mode==='register'?'Create account':'Sign in'}
});
(async function(){
  try{
    const j=await (await fetch('/api/auth/status')).json();
    if(j.authenticated){window.location.replace('/');return}
    if(j.wsName)$('#wsName').textContent=j.wsName;
    if(j.needsSetup){setMode('register')}
    else if(j.allowSignup){$('#toggleWrap').style.display='block'}
  }catch(e){}
})();
</script>
</body>
</html>
